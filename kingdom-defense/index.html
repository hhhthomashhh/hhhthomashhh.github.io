<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Defense</title><style>html,body{margin:0;height:100%;background:#06121a;color:#fff;font-family:system-ui,sans-serif}.load{height:100%;display:grid;place-items:center;text-align:center}.spin{font-size:42px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div><div class="spin">⚔</div><h2>Loading Kingdom Defense…</h2></div></div><script>(async()=>{try{const names=['data-00.txt','data-01.txt','data-02.txt','data-03.txt','data-04.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><h2>Unable to load Kingdom Defense</h2><p>Please refresh the page in a current version of Safari, Chrome, Edge, or Firefox.</p></div></div>';console.error(e)}})();</script></body></html>
