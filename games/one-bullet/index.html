<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE BULLET — Loading…</title><style>html,body{height:100%;margin:0;background:#090c11;color:#f3f6fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.load{text-align:center}.dot{color:#f6c945}</style></head><body><div class="load"><h1>ONE BULLET<span class="dot">.</span></h1><p>Loading game…</p></div><script>(async()=>{try{const files=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><h1>ONE BULLET</h1><p>Could not load the game. Please refresh.</p></div>';console.error(e)}})();</script></body></html>
