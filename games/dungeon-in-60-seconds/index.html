pon.chain){const first=nearestEnemy(140);if(first)damageEnemy(first,dmg*.55)}\n      if(hit){game.shake=Math.max(game.shake,3);sfx('hit')}\n      else tone(190,.035,'sawtooth',.009,60);\n    }\n    return true;\n  };\n\n  const oldUpdate=update;\n  update=function(dt){\n    if(game?.player?.swing>0)game.player.swing=Math.max(0,game.player.swing-dt);\n    oldUpdate(dt);\n    if(!game||game.paused||!game.running)return;\n    const now=performance.now()/1000,p=game.player;\n    if((held||keys[' ']||queuedUntil>now)&&now>=(p.nextAttack||0))attack(aim?.x??null,aim?.y??null);\n  };\n\n  const oldDrawPlayer=drawPlayer;\n  drawPlayer=function(){\n    oldDrawPlayer();\n    if(!game?.player?.swing)return;\n    const p=game.player,life=Math.min(1,p.swing/.15),progress=1-life,base=game.lastAim||-Math.PI/2;\n    const ranged=p.weapon.type==='ranged'||save.selectedHero==='wizard'||save.selectedHero==='ranger';\n    ctx.save();ctx.translate(p.x,p.y);\n    if(!ranged){\n      const a=base-1.15+progress*2.3;\n      ctx.globalAlpha=.35+.65*life;\n      ctx.strokeStyle='#ffe6a0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,p.r+22,base-1.05,base+1.05);ctx.stroke();\n      ctx.rotate(a);\n      ctx.fillStyle='#5b3a24';ctx.fillRect(10,-3,12,6);\n      ctx.fillStyle='#d7b45a';ctx.fillRect(19,-7,4,14);\n      ctx.fillStyle='#f4f0df';ctx.beginPath();ctx.moveTo(22,-4);ctx.lineTo(49,0);ctx.lineTo(22,4);ctx.closePath();ctx.fill();\n      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();\n    }else{\n      ctx.rotate(base);ctx.globalAlpha=.4+.6*life;ctx.fillStyle='#fff1a5';\n      for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillRect(p.r+5,-2,14,4)}\n    }\n    ctx.restore();\n  };\n\n  const s=document.querySelector('#stick'),k=document.querySelector('#stickKnob');\n  if(s&&k){\n    let pid=null;\n    const move=e=>{\n      if(e.pointerId!==pid)return;e.preventDefault();\n      const q=s.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2,rx=e.clientX-cx,ry=e.clientY-cy,m=Math.hypot(rx,ry),dead=4,full=24,vmax=q.width*.29;\n      let dx=rx,dy=ry;if(m>vmax){dx*=vmax/m;dy*=vmax/m}\n      if(m<=dead){joy.x=joy.y=0}else{const power=Math.min(1,(m-dead)/full),ux=rx/(m||1),uy=ry/(m||1);joy.x=ux*power;joy.y=uy*power}\n      k.style.transform=`translate(${dx}px,${dy}px)`;\n    };\n    s.addEventListener('pointerdown',e=>{pid=e.pointerId;try{s.setPointerCapture(pid)}catch(_){}move(e)},{passive:false});\n    s.addEventListener('pointermove',move,{passive:false});\n    const end=e=>{if(e.pointerId===pid){pid=null;joy.x=joy.y=0;k.style.transform=''}};\n    s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end);s.addEventListener('lostpointercapture',end);\n  }\n\n  const btn=document.querySelector('#attackBtn');\n  if(btn){\n    btn.addEventListener('pointerdown',e=>{e.preventDefault();held=true;try{btn.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});\n    const end=e=>{e.preventDefault();held=false};btn.addEventListener('pointerup',end,{passive:false});btn.addEventListener('pointercancel',end,{passive:false});btn.addEventListener('lostpointercapture',()=>held=false);\n  }\n  canvas.addEventListener('pointerdown',e=>{if(game&&!game.paused&&!touchCap){mousePid=e.pointerId;held=true;aim={x:e.clientX,y:e.clientY};try{canvas.setPointerCapture(e.pointerId)}catch(_){}}});\n  canvas.addEventListener('pointermove',e=>{if(e.pointerId===mousePid)aim={x:e.clientX,y:e.clientY}});\n  const mouseEnd=e=>{if(e.pointerId===mousePid){mousePid=null;held=false;aim=null}};canvas.addEventListener('pointerup',mouseEnd);canvas.addEventListener('pointercancel',mouseEnd);\n\n  const oldPause=pause;pause=function(){clearAttackState();return oldPause()};\n  const oldEnd=endRun;endRun=function(reason){clearAttackState();return oldEnd(reason)};\n  const oldStart=startRun;startRun=function(daily=false){clearAttackState();return oldStart(daily)};\n  addEventListener('blur',clearAttackState);\n})();\n</script>";html=html.replace('</body>',addon+'</body>');document.open();document.write(html);document.close()}catch(e){status.className='bad';status.innerHTML='The dungeon failed to load.<small>'+String(e.message||e)+'</small>';console.error(e)}})();</script></body></html>
