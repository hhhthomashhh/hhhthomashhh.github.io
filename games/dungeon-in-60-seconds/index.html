<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e13"><title>Dungeon in 60 Seconds</title><style>html,body{margin:0;width:100%;height:100%;background:#0c0e13;color:#f4f1e8;font:600 16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}#s{padding:28px;text-align:center}.bad{color:#ef5d62}small{display:block;margin-top:10px;color:#aaa99f}</style></head><body><div id="s">Entering the dungeon…<small>Loading v1.7.2</small></div><script>
(async()=>{const parts=["b01.txt","b02.txt","b03.txt","b04.txt","c05_06.txt","c07_08.txt","c09_10.txt","c11_12.txt","c13_14.txt","c15_16.txt","c17_18.txt","c19_20.txt"],status=document.getElementById('s');try{const [texts,patch,hotfix1,hotfix2]=await Promise.all([Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+p);return r.text()})),fetch('patch-v1.7.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing v1.7 patch');return r.text()}),fetch('hotfix-v1.7.1.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing v1.7.1 hotfix');return r.text()}),fetch('hotfix-v1.7.2.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing v1.7.2 hotfix');return r.text()})]);const b64=texts.join('').replace(/\s+/g,'');if(!b64||b64.length%4!==0)throw new Error('Game data is incomplete');const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let html=new TextDecoder('utf-8').decode(bytes),marker='renderMenu();\n})();';if(!html.includes('<!doctype html>')&&!html.includes('<!DOCTYPE html>'))throw new Error('Game data could not be decoded');if(!html.includes(marker))throw new Error('Game patch marker missing');html=html.replace(marker,patch+'\n'+hotfix1+'\n'+hotfix2+'\nrenderMenu();\n})();');document.open();document.write(html);document.close()}catch(e){status.className='bad';status.innerHTML='The dungeon failed to load.<small>'+String(e.message||e)+'</small>';console.error(e)}})();
</script></body></html>
