<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<title>Dungeon in 60 Seconds</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0c0e13;color:#f4f1e8;font:600 16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}#s{padding:28px;text-align:center}.bad{color:#ef5d62}small{display:block;margin-top:10px;color:#aaa99f}
</style>
</head>
<body><div id="s">Entering the dungeon…<small>Loading game</small></div>
<script>
(async()=>{
 const parts=['b01.txt','b02.txt','b03.txt','b04.txt','c05_06.txt','c07_08.txt','c09_10.txt','c11_12.txt','c13_14.txt','c15_16.txt','c17_18.txt','c19_20.txt'];
 const status=document.getElementById('s');
 try{
  const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+p);return r.text()}));
  const b64=texts.join('').replace(/\s+/g,'');
  let h=2166136261>>>0; for(let i=0;i<b64.length;i++){h^=b64.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  if(b64.length!==69288 || h!==341534310) throw new Error('Game data verification failed');
  const bin=atob(b64), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const html=new TextDecoder('utf-8').decode(bytes);
  document.open();document.write(html);document.close();
 }catch(e){status.className='bad';status.innerHTML='The dungeon failed to load.<small>'+String(e.message||e)+'</small>';console.error(e);}
})();
</script></body></html>
