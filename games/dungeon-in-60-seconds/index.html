tEnemy(140);if(first)damageEnemy(first,dmg*.55)}if(hit){game.shake=Math.max(game.shake,3);sfx('hit')}}return true};\nconst oldUpdate=update;update=function(dt){if(game?.player?.swing>0)game.player.swing=Math.max(0,game.player.swing-dt);oldUpdate(dt);if(!game||game.paused||!game.running)return;const now=performance.now()/1000,p=game.player;if((held||keys[' ']||queuedUntil>now)&&now>=(p.nextAttack||0))attack(aim?.x??null,aim?.y??null)};\nconst oldDrawPlayer=drawPlayer;drawPlayer=function(){oldDrawPlayer();if(!game?.player?.swing)return;const p=game.player,total=.34,life=Math.min(1,p.swing/total),progress=1-life,base=p.swingAng??game.lastAim??-Math.PI/2,ranged=p.weapon.type==='ranged'||save.selectedHero==='wizard'||save.selectedHero==='ranger';ctx.save();ctx.translate(p.x,p.y);if(!ranged){const a=base-1.35+progress*2.7;ctx.globalAlpha=.28+.72*life;ctx.strokeStyle='#ffdf68';ctx.lineWidth=13;ctx.lineCap='round';ctx.shadowColor='#ffeaa0';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,p.r+54,base-1.35+progress*.18,base+1.20+progress*.18);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#fff8c9';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,p.r+54,base-1.25+progress*.18,base+1.10+progress*.18);ctx.stroke();ctx.rotate(a);ctx.fillStyle='#6b4427';ctx.fillRect(p.r-10,-5,16,10);ctx.fillStyle='#d6aa45';ctx.fillRect(p.r+4,-10,7,20);ctx.shadowColor='#ffffff';ctx.shadowBlur=14;ctx.fillStyle='#eef6ff';ctx.beginPath();ctx.moveTo(p.r+9,-7);ctx.lineTo(p.r+70,0);ctx.lineTo(p.r+9,7);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke()}else{ctx.rotate(base);ctx.globalAlpha=.45+.55*life;ctx.fillStyle='#fff1a5';ctx.shadowColor='#fff1a5';ctx.shadowBlur=14;for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillRect(p.r+5,-3,18,6)}ctx.shadowBlur=0}ctx.restore()};\nconst btn=document.querySelector('#attackBtn');if(btn){btn.addEventListener('pointerdown',e=>{e.preventDefault();held=true;attack();try{btn.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});const end=e=>{e.preventDefault();held=false};btn.addEventListener('pointerup',end,{passive:false});btn.addEventListener('pointercancel',end,{passive:false});btn.addEventListener('lostpointercapture',()=>held=false)}\ncanvas.addEventListener('pointerdown',e=>{if(game&&!game.paused&&!touchCap){mousePid=e.pointerId;held=true;aim={x:e.clientX,y:e.clientY};attack(e.clientX,e.clientY);try{canvas.setPointerCapture(e.pointerId)}catch(_){}}});canvas.addEventListener('pointermove',e=>{if(e.pointerId===mousePid)aim={x:e.clientX,y:e.clientY}});const mouseEnd=e=>{if(e.pointerId===mousePid){mousePid=null;held=false;aim=null}};canvas.addEventListener('pointerup',mouseEnd);canvas.addEventListener('pointercancel',mouseEnd);\nconst oldPause=pause;pause=function(){clearAttackState();return oldPause()};const oldEnd=endRun;endRun=function(reason){clearAttackState();return oldEnd(reason)};const oldStart=startRun;startRun=function(daily=false){clearAttackState();return oldStart(daily)};addEventListener('blur',clearAttackState);\n})();<\/script>";html=html.replace('</body>',addon+'</body>');document.open();document.write(html);document.close()}catch(e){status.className='bad';status.innerHTML='The dungeon failed to load.<small>'+String(e.message||e)+'</small>';console.error(e)}})();</script></body></html>
