<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e13"><title>Dungeon in 60 Seconds</title><style>html,body{margin:0;width:100%;height:100%;background:#0c0e13;color:#f4f1e8;font:600 16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}#s{padding:28px;text-align:center}.bad{color:#ef5d62}small{display:block;margin-top:10px;color:#aaa99f}</style></head><body><div id="s">Entering the dungeon…<small>Loading v1.5</small></div><script>
(async()=>{const parts=['b01.txt','b02.txt','b03.txt','b04.txt','c05_06.txt','c07_08.txt','c09_10.txt','c11_12.txt','c13_14.txt','c15_16.txt','c17_18.txt','c19_20.txt'];const status=document.getElementById('s');try{const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+p);return r.text()}));const b64=texts.join('').replace(/\s+/g,'');let h=2166136261>>>0;for(let i=0;i<b64.length;i++){h^=b64.charCodeAt(i);h=Math.imul(h,16777619)>>>0}if(b64.length!==69288||h!==341534310)throw new Error('Game data verification failed');const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let html=new TextDecoder('utf-8').decode(bytes);const patch="\n// v1.5 direct in-scope gameplay fixes\nconst V15='1.5';\nconst _v15RenderMenu=renderMenu;\nrenderMenu=function(){\n  _v15RenderMenu();\n  const sub=document.querySelector('#menu .sub');\n  if(sub){sub.innerHTML=sub.innerHTML.replace(/\\s*&nbsp;\\s*·\\s*&nbsp;\\s*v\\d+\\.\\d+/i,'');sub.innerHTML+=` &nbsp; · &nbsp; v${V15}`}\n};\nconst _v15CollectPickup=collectPickup;\ncollectPickup=function(x){\n  if(x&&!x.dead&&x.type==='hourglass'){\n    x.dead=true;\n    const before=game.time;\n    addTime(10);\n    const gained=Math.max(0,game.time-before);\n    game.score+=120;\n    toast('TIME BONUS! +'+Math.round(gained)+' SEC');\n    return;\n  }\n  return _v15CollectPickup(x);\n};\nconst _v15OpenRoomChoice=openRoomChoice;\nopenRoomChoice=function(type){\n  _v15OpenRoomChoice(type);\n  if(type==='mystery'){\n    const wrap=document.querySelector('#choiceButtons');\n    if(wrap){for(const b of wrap.querySelectorAll('button')){if(b.textContent==='CLOCK — +3 SEC'){b.textContent='CLOCK — +10 SEC';b.onclick=()=>{addTime(10);document.querySelector('#choiceOverlay').classList.remove('active');game.paused=false}}}}\n  }\n};\nattack=function(tx=null,ty=null){\n  if(!game||game.paused||!game.running)return false;\n  const p=game.player,now=performance.now()/1000;\n  let target=nearestEnemy(9999),ang=game.lastAim||-Math.PI/2;\n  if(tx!=null&&ty!=null)ang=Math.atan2(ty-p.y,tx-p.x);\n  else if(target)ang=Math.atan2(target.y-p.y,target.x-p.x);\n  game.lastAim=ang;\n  p.swingAng=ang;\n  p.swing=.34;\n  const ranged=p.weapon.type==='ranged'||save.selectedHero==='wizard'||save.selectedHero==='ranger';\n  let rate=Math.max(.10,(p.rate+p.weapon.rate)/(1+p.buffs.atkSpeed+(p.rage>0?.45:0)))*.80;\n  if(ranged)rate=Math.min(rate,.34);\n  if(save.selectedHero==='knight'&&p.weapon.n==='Iron Sword')rate=Math.min(rate,.25);\n  if(now-(p.lastAtk??-99)<rate)return false;\n  p.lastAtk=now;\n  const range=(p.weapon.type==='ranged'?p.weapon.range:p.range+p.weapon.range),dmg=p.damage+p.weapon.dmg;\n  if(ranged){\n    const muzzle=p.r+7;\n    game.projectiles.push({x:p.x+Math.cos(ang)*muzzle,y:p.y+Math.sin(ang)*muzzle,vx:Math.cos(ang)*560,vy:Math.sin(ang)*560,r:7,life:range/560+.28,dmg,player:true,burn:p.weapon.burn,color:p.weapon.burn?'#ff9955':'#d6e7ff'});\n    tone(320,.03,'square',.015,80);\n  }else{\n    tone(210,.04,'triangle',.014,90);\n    let hit=0;\n    for(const e of game.enemies){\n      if(e.dead)continue;\n      const dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy),da=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(da-ang),Math.cos(da-ang));\n      if(dist<=range+e.r&&Math.abs(diff)<1.05){damageEnemy(e,dmg*(rng()<p.buffs.crit?1.8:1));hit++}\n    }\n    if(hit&&p.weapon.chain){const first=nearestEnemy(140);if(first)damageEnemy(first,dmg*.55)}\n    if(hit){game.shake=Math.max(game.shake,3);sfx('hit')}\n  }\n  return true;\n};\nconst _v15DrawPlayer=drawPlayer;\ndrawPlayer=function(){\n  _v15DrawPlayer();\n  if(!game||!game.player)return;\n  const p=game.player;\n  const ranged=p.weapon.type==='ranged'||save.selectedHero==='wizard'||save.selectedHero==='ranger';\n  if(ranged)return;\n  const total=.34,active=(p.swing||0)>0,life=active?Math.min(1,p.swing/total):0,progress=active?1-life:0;\n  const base=p.swingAng??game.lastAim??-Math.PI/2;\n  const ang=active?base-1.35+progress*2.7:base+.72;\n  ctx.save();ctx.translate(p.x,p.y);\n  if(active){\n    ctx.globalAlpha=.92;\n    ctx.lineCap='round';ctx.shadowColor='#fff2a8';ctx.shadowBlur=20;\n    ctx.strokeStyle='#ffd84f';ctx.lineWidth=14;ctx.beginPath();ctx.arc(0,0,p.r+55,base-1.28,base+1.28);ctx.stroke();\n    ctx.shadowBlur=0;ctx.strokeStyle='#fffbd2';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,p.r+55,base-1.22,base+1.22);ctx.stroke();\n  }\n  ctx.rotate(ang);\n  ctx.globalAlpha=active?1:.95;\n  ctx.fillStyle='#704727';ctx.fillRect(p.r-8,-5,18,10);\n  ctx.fillStyle='#d8aa43';ctx.fillRect(p.r+7,-11,7,22);\n  ctx.shadowColor='#dff7ff';ctx.shadowBlur=active?18:10;\n  ctx.fillStyle='#eef8ff';ctx.beginPath();ctx.moveTo(p.r+12,-8);ctx.lineTo(p.r+(active?76:58),0);ctx.lineTo(p.r+12,8);ctx.closePath();ctx.fill();\n  ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();\n  ctx.restore();\n};\nconst _v15Update=update;\nupdate=function(dt){\n  if(game?.player?.swing>0)game.player.swing=Math.max(0,game.player.swing-dt);\n  _v15Update(dt);\n};\nlet v15Held=false,v15TouchPid=null;\nconst v15AttackBtn=document.querySelector('#attackBtn');\nif(v15AttackBtn){\n  v15AttackBtn.onpointerdown=e=>{e.preventDefault();v15Held=true;v15TouchPid=e.pointerId;attack();try{v15AttackBtn.setPointerCapture(e.pointerId)}catch(_){}};\n  const end=e=>{if(v15TouchPid===null||e.pointerId===v15TouchPid){v15Held=false;v15TouchPid=null}};\n  v15AttackBtn.onpointerup=end;v15AttackBtn.onpointercancel=end;v15AttackBtn.onlostpointercapture=()=>{v15Held=false;v15TouchPid=null};\n}\nconst _v15LoopUpdate=update;\nupdate=function(dt){\n  _v15LoopUpdate(dt);\n  if(v15Held&&game&&!game.paused&&game.running)attack();\n};\n";const marker='renderMenu();\n})();';if(!html.includes(marker))throw new Error('Game patch marker missing');html=html.replace(marker,patch+'\nrenderMenu();\n})();');document.open();document.write(html);document.close()}catch(e){status.className='bad';status.innerHTML='The dungeon failed to load.<small>'+String(e.message||e)+'</small>';console.error(e)}})();
</script></body></html>
